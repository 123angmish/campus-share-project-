name: CampusShare CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:

jobs:
  backend:
    name: Backend · Java 21 · Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campusshare-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test and package
        run: mvn -B --no-transfer-progress clean verify

  frontend:
    name: Frontend · Node 22 · Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campusshare-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: campusshare-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
