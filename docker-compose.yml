services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusshare
      POSTGRES_USER: campusshare
      POSTGRES_PASSWORD: campusshare
    volumes:
      - campusshare_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusshare -d campusshare"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./campusshare-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/campusshare
      DATABASE_USERNAME: campusshare
      DATABASE_PASSWORD: campusshare
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-before-real-deployment-123456789}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
      REFRESH_COOKIE_SECURE: "false"
      REFRESH_COOKIE_SAME_SITE: Lax
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-college.edu,university.edu,student.edu,banasthali.in}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./campusshare-frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  campusshare_pg:
